server {
    # 8080, not 80: the container runs as the unprivileged `nginx` user and a
    # non-root process cannot bind a port below 1024. docker-compose maps
    # 5173 -> 8080.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security response headers (issue: add CSP headers to the frontend nginx).
    # Declared at server level so every location inherits them; `always` keeps
    # them on error responses too. Do not add `add_header` inside a location
    # without repeating these - nginx stops inheriting them when it does.
    #
    # Content-Security-Policy notes:
    #  - script-src 'self' plus the sha256 of the inline theme bootstrap script
    #    in index.html. If that script changes, regenerate the hash.
    #  - style-src needs 'unsafe-inline' because React inline `style` props
    #    compile to style attributes.
    #  - connect-src lists the Soroban RPC / Horizon endpoints for both
    #    networks (frontend/src/lib/stellar.ts), the price API
    #    (frontend/src/lib/prices.ts) and Sentry. API calls go through the
    #    same-origin /api/ proxy below ('self'). If the image is built with
    #    VITE_API_URL pointing at a different origin, add that origin here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gGHX6zQB+qG8FhYEfLZ/h72lFY1j5Hr37gWGPhkWdkA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://soroban-testnet.stellar.org https://horizon-testnet.stellar.org https://soroban-mainnet.stellar.org https://horizon.stellar.org https://api.coingecko.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for static assets (issue #303)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
