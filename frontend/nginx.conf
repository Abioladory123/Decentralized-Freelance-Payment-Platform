server {
    # 8080, not 80: the container runs as the unprivileged `nginx` user and a
    # non-root process cannot bind a port below 1024. docker-compose maps
    # 5173 -> 8080.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets (issue #303)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
